name: .NET build and test

on:
  push:
    branches: ["checkpoint/**", "main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  environment-independent-tests:
    name: Environment-Independent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore HamaraCommerce.sln
      - name: Build in Release mode
        run: dotnet build HamaraCommerce.sln --configuration Release --no-restore
      - name: Run environment-independent tests
        run: dotnet test HamaraCommerce.sln --configuration Release --no-build --logger "trx;LogFileName=test-results-independent.trx" --filter "FullyQualifiedName!~CheckoutIdempotencyRealSqlTests&FullyQualifiedName!~OutboxSqlReliabilityTests&FullyQualifiedName!~LastUnitContention_TwoConcurrentPurchases_ExactlyOneSucceeds&FullyQualifiedName!~RetryOutboxEmail_ConcurrentRetryRequests_QueuesOneRetryOnly&FullyQualifiedName!~TransactionRollback_EnsuresAllModificationsRollbackOnFailure"
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-independent
          path: "**/test-results-independent.trx"
          if-no-files-found: ignore

  sql-server-integration-tests:
    name: SQL Server Integration Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Start SQL Server LocalDB
        run: |
          sqllocaldb start mssqllocaldb
          sqllocaldb info mssqllocaldb
      - name: Restore
        run: dotnet restore HamaraCommerce.sln
      - name: Build in Release mode
        run: dotnet build HamaraCommerce.sln --configuration Release --no-restore
      - name: Run SQL Server integration tests
        env:
          HAMARA_TEST_SQL_CONNECTION: "Server=(localdb)\\mssqllocaldb;Trusted_Connection=True;MultipleActiveResultSets=true;TrustServerCertificate=True;Connect Timeout=60"
        run: dotnet test HamaraCommerce.sln --configuration Release --no-build --logger "trx;LogFileName=test-results-sql.trx" --filter "FullyQualifiedName~CheckoutIdempotencyRealSqlTests|FullyQualifiedName~OutboxSqlReliabilityTests|FullyQualifiedName~LastUnitContention_TwoConcurrentPurchases_ExactlyOneSucceeds|FullyQualifiedName~RetryOutboxEmail_ConcurrentRetryRequests_QueuesOneRetryOnly|FullyQualifiedName~TransactionRollback_EnsuresAllModificationsRollbackOnFailure"
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sql
          path: "**/test-results-sql.trx"
          if-no-files-found: ignore


